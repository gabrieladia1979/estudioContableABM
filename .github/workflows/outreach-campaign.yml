name: Campaña de Outreach y Prospección Local
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
      limit:
        description: 'Cantidad máxima de vistas previas'
        required: true
        default: '5'
      barrio:
        description: 'Filtrar por barrio (ej: boedo, parque patricios, barracas, pompeya - dejar vacío para todos)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar motor de prospección
        env:
          OUTREACH_MODE: preview
          OUTREACH_LIMIT: ${{ github.event.inputs.limit || '5' }}
          OUTREACH_BARRIO: ${{ github.event.inputs.barrio || '' }}
        run: node scripts/outreach-send.mjs
